<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OneKit</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --panel: #ffffff;
        --text: #1b1e24;
        --muted: #6b7280;
        --border: #e4e7ec;
        --accent: #6366f1;
        --accent-soft: rgba(99, 102, 241, 0.1);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101318;
          --panel: #1a1e26;
          --text: #e7e9ee;
          --muted: #9aa1ad;
          --border: #2a2f3a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 24px 40px;
      }
      header {
        margin-bottom: 28px;
      }
      .brand {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .brand span {
        color: var(--muted);
        font-weight: 400;
      }
      h1 {
        font-size: 26px;
        margin: 14px 0 2px;
      }
      .date {
        color: var(--muted);
        font-size: 13px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        margin-bottom: 18px;
      }
      .card h2 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      input[type="text"] {
        flex: 1;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        border-radius: 9px;
        padding: 8px 10px;
        font: 13px/1.4 system-ui, sans-serif;
      }
      button {
        border: none;
        background: var(--accent);
        color: #fff;
        border-radius: 9px;
        padding: 8px 14px;
        font: 600 13px system-ui, sans-serif;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      ul.goals {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      ul.goals li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 4px;
        border-bottom: 1px solid var(--border);
      }
      ul.goals li:last-child {
        border-bottom: none;
      }
      ul.goals input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      ul.goals label {
        flex: 1;
        cursor: pointer;
      }
      ul.goals li.done label {
        color: var(--muted);
        text-decoration: line-through;
      }
      ul.goals .x {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 15px;
        padding: 2px 6px;
        cursor: pointer;
      }
      .links {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }
      .links a {
        display: block;
        text-align: center;
        text-decoration: none;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 8px;
        font-size: 13px;
        position: relative;
      }
      .links a:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .links a .remove {
        position: absolute;
        top: 2px;
        right: 6px;
        color: var(--muted);
        font-size: 12px;
        opacity: 0;
      }
      .links a:hover .remove {
        opacity: 1;
      }
      .footer-note {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        margin-top: 26px;
      }
      .habit-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 4px;
        border-bottom: 1px solid var(--border);
      }
      .habit-item:last-child {
        border-bottom: none;
      }
      .habit-item .name {
        flex: 1;
        min-width: 120px;
      }
      .habit-item .streak {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .habit-item .check {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .habit-item .x {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 15px;
        padding: 2px 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">OneKit <span>· local browser toolbox</span></div>
        <h1 id="greeting">Good day</h1>
        <div class="date" id="date"></div>
      </header>

      <div class="card">
        <h2>🎯 Today's goals</h2>
        <div class="row">
          <input id="goal-input" type="text" placeholder="What matters today?" maxlength="120" />
          <button id="goal-add">Add</button>
        </div>
        <ul class="goals" id="goal-list"></ul>
      </div>

      <div class="card">
        <h2>✅ Habits today</h2>
        <div id="habit-list"></div>
        <div class="footer-note" id="habit-empty">Add habits in the OneKit popup → Focus, or right here on the dashboard.</div>
      </div>

      <div class="card">
        <h2>🔗 Quick links</h2>
        <div class="links" id="link-list"></div>
        <div class="row">
          <input id="link-label" type="text" placeholder="Label (optional)" maxlength="40" />
          <input id="link-url" type="text" placeholder="https://example.com" spellcheck="false" />
          <button id="link-add">Add</button>
        </div>
        <div id="link-status" class="footer-note"></div>
      </div>

      <div class="footer-note">Everything stays on this device — no account, no cloud, no tracking.</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
