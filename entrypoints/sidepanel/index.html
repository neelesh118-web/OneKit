<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneKit</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 12px;
        background: var(--bg, #f8fafc);
        color: var(--fg, #0f172a);
        min-height: 100vh;
      }
      [data-theme="dark"] {
        --bg: #0f172a;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --card: #1e293b;
        --accent: #4f46e5;
      }
      [data-theme="light"] {
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #64748b;
        --card: #ffffff;
        --accent: #4f46e5;
      }
      h1 {
        font-size: 14px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input[type="search"],
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--muted);
        border-radius: 8px;
        background: var(--card);
        color: inherit;
        font: inherit;
      }
      .results {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .row {
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--card);
        cursor: pointer;
      }
      .row:hover {
        outline: 1px solid var(--accent);
      }
      .row-title {
        font-weight: 600;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-sub {
        font-size: 11px;
        color: var(--muted);
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .group-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 8px 2px 2px;
      }
      .empty {
        color: var(--muted);
        padding: 10px 2px;
        font-size: 12px;
      }
      .card {
        margin-top: 14px;
        padding: 10px;
        border-radius: 10px;
        background: var(--card);
        border: 1px solid var(--muted);
      }
      .card-title {
        font-weight: 600;
        margin-bottom: 6px;
      }
      .btn-row {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      button {
        padding: 6px 10px;
        border: 1px solid var(--muted);
        border-radius: 7px;
        background: var(--card);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        border-color: #dc2626;
        color: #dc2626;
      }
      select {
        padding: 5px;
        border-radius: 6px;
        border: 1px solid var(--muted);
        background: var(--card);
        color: inherit;
        font: inherit;
      }
      .status {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 6px;
      }
      .footer {
        margin-top: 16px;
        text-align: center;
      }
      .footer button {
        border: none;
        color: var(--accent);
        background: none;
        text-decoration: underline;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <h1>🧩 OneKit</h1>
    <input
      id="search"
      type="search"
      placeholder="Search pages, chats, tabs, saved items, tools…"
      autocomplete="off"
      spellcheck="false"
    />
    <div id="results" class="results"></div>

    <div class="card">
      <div class="card-title">🎯 Focus session</div>
      <div class="btn-row">
        <select id="session-minutes">
          <option value="25">25 min</option>
          <option value="45" selected>45 min</option>
          <option value="60">60 min</option>
          <option value="90">90 min</option>
          <option value="120">120 min</option>
        </select>
        <button id="session-start" type="button" class="primary">Start</button>
        <button id="session-end" type="button" class="danger">End now</button>
      </div>
      <p id="session-status" class="status"></p>
    </div>

    <div class="card">
      <div class="card-title">⏱ Screen time today</div>
      <p id="screen-time" class="status">…</p>
    </div>

    <div class="footer">
      <button id="open-popup" type="button">Open the full OneKit panel →</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
